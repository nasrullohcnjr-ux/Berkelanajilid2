<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Komunikasi Multifungsi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    .card-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .card-header h2 {
      font-size: 1.25rem;
      color: #0f172a;
    }
    .card-header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #2563eb;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-wa { background-color: #25D366; }
    .btn-gmail { background-color: #EA4335; }
    .btn-sms { background-color: #007AFF; }
    .btn-messenger { background-color: #0084FF; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h2>Hub Komunikasi</h2>
      <p>Pilih saluran untuk mengirim pesan cepat</p>
    </div>

    <!-- Form Input Data -->
    <div class="form-group">
      <label for="phone">Nomor HP / WA (Contoh: 628123456789)</label>
      <input type="tel" id="phone" placeholder="628xxxxxxxxxx">
    </div>

    <div class="form-group">
      <label for="email">Alamat Email Tujuan</label>
      <input type="email" id="email" placeholder="nama@email.com">
    </div>

    <div class="form-group">
      <label for="fbUser">Username Messenger / Facebook</label>
      <input type="text" id="fbUser" placeholder="username.facebook">
    </div>

    <div class="form-group">
      <label for="message">Isi Pesan / Template</label>
      <textarea id="message" placeholder="Tuliskan pesan atau catatan pesanan di sini..."></textarea>
    </div>

    <!-- Tombol Aksi Kunci -->
    <div class="button-grid">
      <button class="btn btn-wa" onclick="openWhatsApp()">
        WhatsApp
      </button>

      <button class="btn btn-gmail" onclick="openGmail()">
        Gmail
      </button>

      <button class="btn btn-sms" onclick="openSMS()">
        Pesan (SMS)
      </button>

      <button class="btn btn-messenger" onclick="openMessenger()">
        Messenger
      </button>
    </div>
  </div>

  <script>
    // Fungsi untuk membuka WhatsApp
    function openWhatsApp() {
      const phone = document.getElementById('phone').value.trim();
      const message = encodeURIComponent(document.getElementById('message').value);
      
      if (!phone) {
        alert("Silakan masukkan nomor WhatsApp terlebih dahulu.");
        return;
      }
      
      const waUrl = `https://wa.me/${phone}?text=${message}`;
      window.open(waUrl, '_blank');
    }

    // Fungsi untuk membuka Client Email (Gmail)
    function openGmail() {
      const email = document.getElementById('email').value.trim();
      const message = encodeURIComponent(document.getElementById('message').value);
      const subject = encodeURIComponent("Pesan Baru dari Aplikasi");

      if (!email) {
        alert("Silakan masukkan alamat email tujuan.");
        return;
      }

      const mailtoUrl = `mailto:${email}?subject=${subject}&body=${message}`;
      window.location.href = mailtoUrl;
    }

    // Fungsi untuk membuka Aplikasi SMS bawaan
    function openSMS() {
      const phone = document.getElementById('phone').value.trim();
      const message = encodeURIComponent(document.getElementById('message').value);

      if (!phone) {
        alert("Silakan masukkan nomor tujuan SMS.");
        return;
      }

      const smsUrl = `sms:${phone}?body=${message}`;
      window.location.href = smsUrl;
    }

    // Fungsi untuk membuka Messenger
    function openMessenger() {
      const fbUser = document.getElementById('fbUser').value.trim();

      if (!fbUser) {
        alert("Silakan masukkan username Facebook/Messenger.");
        return;
      }

      const messengerUrl = `https://m.me/${fbUser}`;
      window.open(messengerUrl, '_blank');
    }
  </script>

</body>
</html>
